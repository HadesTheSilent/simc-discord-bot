name: 🔒 Secret Scan

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  gitleaks:
    name: 🔍 Gitleaks Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔒 Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config: .gitleaks.toml
      
      - name: 📋 Upload Gitleaks Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.json
          retention-days: 5

  # Job adicional para análise em modo verbose (apenas em PRs)
  gitleaks-verbose:
    name: 🔍 Detailed Secret Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
      
      - name: 🔍 Run Detailed Scan
        run: |
          echo "🔍 Executando varredura detalhada..."
          gitleaks detect --config .gitleaks.toml --verbose --report-format json --report-path detailed-report.json || true
          
          echo "📊 Resultados da análise:"
          if [ -f detailed-report.json ] && [ -s detailed-report.json ]; then
            echo "⚠️ Segredos detectados - verifique o relatório"
            jq -r '.[] | "❌ \(.RuleID): \(.File):\(.StartLine)"' detailed-report.json || echo "Erro ao processar relatório"
          else
            echo "✅ Nenhum segredo detectado"
          fi
      
      - name: 📋 Upload Detailed Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-gitleaks-report
          path: detailed-report.json
          retention-days: 30